name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Validate pyproject.toml
        run: uv build --dry-run 2>&1 || true

      - name: Audit dependencies
        run: uv run pip-audit --strict

      - name: Verify package metadata
        run: |
          python -m pip install .
          python -c "import importlib.metadata; m = importlib.metadata.metadata('python-getpaid'); print(m)"
