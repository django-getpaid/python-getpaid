name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Build package
        run: uv build

      - name: Audit dependencies
        # --skip-editable: the project itself is installed editable at a
        # not-yet-released version, so it cannot be audited against PyPI.
        # Known vulnerabilities in dependencies still fail the build.
        run: uv run pip-audit --skip-editable

      - name: Verify package metadata
        run: |
          python -m pip install .
          python -c "import importlib.metadata; m = importlib.metadata.metadata('python-getpaid'); print(m)"
